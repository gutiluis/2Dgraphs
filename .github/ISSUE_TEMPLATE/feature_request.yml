name: Feature Request
description: Propose a new feature or improvement for 2Dgraphs.
title: "[FEATURE] "
labels:
  - enhancement

body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: Describe the feature you would like to add.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this feature be useful?
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: How should this feature be tested?
